# fly.toml app configuration file generated for crud-app-metbxg on 2026-11-14T17:45:21Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'crud-app-metbxg'
primary_region = 'iad'

[build]
[[mounts]]
  source = 'data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
